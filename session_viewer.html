<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Data Humanizer</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
            max-width: 1000px; 
            margin: 0 auto; 
            background-color: #f0f2f5;
        }
        h2 { color: #333; }
        textarea { 
            width: 100%; 
            height: 150px; 
            margin-bottom: 15px; 
            font-family: monospace; 
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button { 
            padding: 10px 20px; 
            cursor: pointer; 
            background-color: #6f42c1; 
            color: white; 
            border: none; 
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
        }
        button:hover { background-color: #59339d; }
        
        .output-section { 
            margin-top: 25px; 
            padding: 20px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            background: #fff; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h3 { margin-top: 0; color: #6f42c1; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* Object Styling */
        .object-block {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }
        .key-value-pair {
            display: flex;
            flex-direction: column;
        }
        .key {
            font-weight: 600;
            color: #495057;
            margin-bottom: 4px;
            text-transform: capitalize;
        }
        .key::after { content: ":"; }
        
        /* Array Styling */
        .array-block {
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-left: 3px solid #6f42c1;
            padding-left: 15px;
            margin-top: 5px;
        }
        .list-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 4px;
        }
        .item-index {
            font-size: 12px;
            font-weight: bold;
            color: #6c757d;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Model Badges */
        .model-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            text-transform: none;
            vertical-align: middle;
        }
        .model-badge.model-real {
            background: #d1e7ff;
            color: #084298;
            border: 1px solid #9ec5fe;
        }
        .model-badge.model-none {
            background: #fff3cd;
            color: #997404;
            border: 1px solid #ffe69c;
        }
        .list-item.no-model-event {
            border-left: 4px solid #ffc107;
            background: #fffdf5;
        }
        
        /* Values */
        .string-value { 
            white-space: pre-wrap; /* Forces \n to render as real newlines */
            word-wrap: break-word; 
            background: #fdfdfe; 
            padding: 12px; 
            border-radius: 4px; 
            border: 1px solid #e2e8f0;
            font-family: Consolas, Monaco, monospace;
            font-size: 14px;
            color: #212529;
            margin: 0;
        }
        .primitive-value {
            font-family: monospace;
            font-size: 15px;
            color: #d63384;
            background: #f8f9fa;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .error { color: #dc3545; font-weight: bold; margin-top: 15px;}
        .b64-image {
            max-width: 100%;
            height: auto;
            display: block;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            background: #fff;
        }
        .image-mime-caption {
            font-size: 12px;
            color: #6c757d;
            font-family: monospace;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <h2>Session Data Humanizer</h2>
    <p>Paste your JSON array or object below to render it cleanly without JSON formatting:</p>
    <textarea id="jsonInput" placeholder='Paste your payload here...'></textarea><br>
    <button onclick="extractSessionInfo()">Render Human-Readable Data</button>

    <div id="output"></div>

    <script>
        function extractSessionInfo() {
            const input = document.getElementById('jsonInput').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = ''; 

            if (!input.trim()) {
                outputDiv.innerHTML = '<p class="error">Please paste some JSON first.</p>';
                return;
            }

            try {
                let data = JSON.parse(input);
                
                // Handle the case where the JSON is wrapped in an array
                let targetObj = Array.isArray(data) ? data[0] : data;

                if (!targetObj || typeof targetObj !== 'object') {
                    throw new Error("Invalid structure. Expected a JSON object or an array containing an object.");
                }

                // Render any top-level image payloads (input image + scaffolding image)
                let imagesHtml = '';
                const imageFields = [
                    ['base64_img_string', 'base64_img_string_mime'],
                    ['scaffolding_base64_img_string', 'scaffolding_base64_img_string_mime']
                ];
                for (const [imgKey, mimeKey] of imageFields) {
                    const b64 = targetObj[imgKey];
                    if (looksLikeBase64Image(b64)) {
                        imagesHtml += `
                            <div class="output-section">
                                <h3>${imgKey}</h3>
                                ${renderImage(b64, targetObj[mimeKey])}
                            </div>`;
                    }
                }

                // Render the output
                outputDiv.innerHTML = `
                    <div class="output-section">
                        <h3>Session State</h3>
                        ${targetObj.session_state ? renderData(targetObj.session_state) : '<p><i>No session_state found.</i></p>'}
                    </div>
                    <div class="output-section">
                        <h3>Session Events</h3>
                        ${targetObj.session_events ? renderData(targetObj.session_events) : '<p><i>No session_events found.</i></p>'}
                    </div>
                    ${imagesHtml}
                `;
            } catch (e) {
                outputDiv.innerHTML = `<p class="error">Error parsing JSON: ${e.message}</p>`;
            }
        }

        // Recursive function to build HTML elements instead of JSON strings
        function renderData(data) {
            if (typeof data === 'string') {
                return `<pre class="string-value">${escapeHTML(data)}</pre>`;
            } else if (typeof data === 'boolean' || typeof data === 'number') {
                return `<span class="primitive-value">${data}</span>`;
            } else if (data === null) {
                return `<span class="primitive-value">null</span>`;
            } else if (Array.isArray(data)) {
                let html = '<div class="array-block">';
                data.forEach((item, index) => {
                    // Events stamped by the pipeline carry a "model" field: "none" marks a
                    // no_model (canned) turn; anything else is the actual model name.
                    const model = (item && typeof item === 'object') ? item.model : undefined;
                    const isNoModel = model === 'none';
                    let badge = '';
                    if (typeof model === 'string') {
                        badge = isNoModel
                            ? '<span class="model-badge model-none">no_model</span>'
                            : `<span class="model-badge model-real">${escapeHTML(model)}</span>`;
                    }
                    html += `
                        <div class="list-item${isNoModel ? ' no-model-event' : ''}">
                            <div class="item-index">Item #${index + 1}${badge}</div>
                            <div class="item-content">${renderData(item)}</div>
                        </div>`;
                });
                html += '</div>';
                return html;
            } else if (typeof data === 'object') {
                // Gemini-style inline image blob: { mimeType|mime_type, data } with raw base64
                const blobMime = data.mimeType || data.mime_type;
                if (blobMime && looksLikeBase64Image(data.data)) {
                    return renderImage(data.data, blobMime);
                }
                let html = '<div class="object-block">';
                for (const [key, value] of Object.entries(data)) {
                    // Clean up the key names slightly for readability (e.g., "math_reasoning" -> "Math reasoning")
                    const cleanKey = key.replace(/_/g, ' ');
                    let valueHtml;
                    if (/base64_img_string$/.test(key) && looksLikeBase64Image(value)) {
                        valueHtml = renderImage(value, data[key + '_mime']);
                    } else if (key === 'b64_json' && looksLikeBase64Image(value)) {
                        // OpenAI-style image blob; mime isn't stored alongside, png covers the default
                        valueHtml = renderImage(value, 'image/png');
                    } else {
                        valueHtml = renderData(value);
                    }
                    html += `
                        <div class="key-value-pair">
                            <div class="key">${escapeHTML(cleanKey)}</div>
                            <div class="value">${valueHtml}</div>
                        </div>`;
                }
                html += '</div>';
                return html;
            }
            return '';
        }

        // Heuristic: long string of base64 characters (and not a sanitized "<IMAGE_BLOB>" placeholder)
        function looksLikeBase64Image(str) {
            return typeof str === 'string'
                && str.length > 100
                && /^[A-Za-z0-9+/=\s]+$/.test(str.slice(0, 200));
        }

        function renderImage(b64, mime) {
            const cleanMime = /^[\w.+-]+\/[\w.+-]+$/.test(mime || '') ? mime : 'image/png';
            return `<img class="b64-image" src="data:${cleanMime};base64,${b64.replace(/\s/g, '')}" alt="embedded image">`
                + `<div class="image-mime-caption">${escapeHTML(cleanMime)} &middot; ${Math.round(b64.length * 3 / 4 / 1024)} KB</div>`;
        }

        // Utility to escape HTML to prevent DOM injection issues
        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
</body>
</html>
